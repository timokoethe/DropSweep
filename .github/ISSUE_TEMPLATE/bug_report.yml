name: Bug report
description: Report something that is not working as expected.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve DropSweep.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - App
        - Website
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
      placeholder: DropSweep should... but it...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open DropSweep
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DropSweep Version (App only)
      placeholder: v0.1.0
  - type: input
    id: macos
    attributes:
      label: macOS Version (App only)
      placeholder: macOS 26.x
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add screenshots, recordings, permissions, or anything else that helps.
